on:
  release:
    types: [published]

name: Release Build and Push
permissions:
  contents: read
  packages: write # Needed to push to GHCR
  id-token: write # Needed read vault secrets

env:
  IMAGE: "k3s-upgrade"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
        fail-fast: true
        matrix:
          include:
            - tag-suffix: "amd64"
              arch: amd64
              os: linux
            - tag-suffix: "arm64"
              arch: arm64
              os: linux
            - tag-suffix: "armhf"
              arch: arm/v7 
              os: linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Change Tag
        run: |
          echo "GIT_TAG=$(echo "${{ github.ref_name }}" | sed -e 's/+/-/g')" >> "$GITHUB_ENV"
    
      - name: Publish Image - Docker
        uses: rancher/ecm-distro-tools/actions/publish-image@master
        env:
          VERSION: ${{ github.ref_name }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        with:
          image: "k3s-upgrade"
          tag: ${{ env.GIT_TAG }}-${{ matrix.tag-suffix }}
          make-target: push-image
          platforms: ${{ matrix.os }}/${{ matrix.arch }}
          
          public-repo: rafiusky
          public-username: ${{ secrets.DOCKER_USERNAME }}
          public-password: ${{ secrets.DOCKER_PASSWORD }}
          push-to-prime: false

  create-manifest:
    runs-on: ubuntu-latest
    needs: [ build-linux ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Change Tag
        run: |
          echo "GIT_TAG=$(echo "${{ github.ref_name }}" | sed -e 's/+/-/g')" >> "$GITHUB_ENV"

      - name: Publish Manifest - Docker
        uses: rancher/ecm-distro-tools/actions/publish-image@master
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        with:
          image: "k3s-upgrade"
          tag: ${{ github.ref_name }}
          make-target: publish-manifest

          public-repo: rafiusky
          public-username: ${{ secrets.DOCKER_USERNAME }}
          public-password: ${{ secrets.DOCKER_PASSWORD }}
          push-to-prime: false

      - name: Inspect Docker image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ env.GIT_TAG }}
